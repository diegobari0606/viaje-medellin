<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerario Medellín · 10–15 de septiembre</title>
<meta name="description" content="Itinerario de viaje a Medellín, editable en vivo.">
<meta name="theme-color" content="#FFF4E4">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Medellín">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Karla:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --papel:#FFF4E4; --papel-2:#FFFBF4; --tinta:#1B2A24; --tinta-suave:#5C6B62; --linea:#E4D6BE;
    --display:"Unbounded","Trebuchet MS",sans-serif;
    --texto:"Karla","Helvetica Neue",Arial,sans-serif;
    --mono:"DM Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  [hidden]{display:none !important}
  a{color:inherit}
  :focus-visible{outline:2.5px solid var(--tinta);outline-offset:2px;border-radius:4px}

  /* ---------- BARRA ---------- */
  .barra{position:sticky;top:0;z-index:40;background:rgba(255,244,228,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
  .barra-int{max-width:900px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .estado{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);
    display:flex;align-items:center;gap:7px;margin-right:auto}
  .punto{width:8px;height:8px;border-radius:50%;background:#0F6B4F;flex:none}
  .punto.guardando{background:#E4571E}
  .punto.local{background:#8C4A2F}
  .boton{border:1.5px solid var(--tinta);background:transparent;color:var(--tinta);font-size:13.5px;font-weight:600;
    padding:7px 15px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .boton:hover{background:var(--tinta);color:var(--papel)}
  .boton.activo{background:var(--tinta);color:var(--papel)}
  .boton.fantasma{border-color:var(--linea);color:var(--tinta-suave)}
  .boton.fantasma:hover{border-color:var(--tinta);background:var(--tinta);color:var(--papel)}
  .menu{position:relative}
  .menu summary{list-style:none;padding:7px 14px}
  .menu summary::-webkit-details-marker{display:none}
  .menu-caja{position:absolute;right:0;top:calc(100% + 8px);background:var(--papel-2);border:1.5px solid var(--tinta);
    border-radius:12px;padding:6px;display:grid;gap:2px;min-width:200px;box-shadow:0 10px 26px rgba(27,42,36,.14);z-index:50}
  .menu-caja button{border:0;background:transparent;color:var(--tinta);text-align:left;font-size:14.5px;
    padding:9px 12px;border-radius:8px;width:100%}
  .menu-caja button:hover{background:var(--papel)}

  .cinta{max-width:900px;margin:0 auto;padding:11px 22px 0}
  .cinta-int{border:1.5px solid var(--acento,#D6246E);color:var(--acento,#D6246E);border-radius:999px;
    padding:8px 18px;font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap}
  .aviso{max-width:900px;margin:14px auto 0;padding:12px 18px;border:1.5px dashed #8C4A2F;border-radius:10px;
    color:#8C4A2F;font-size:14px;background:#fff8ee}
  .aviso code{font-family:var(--mono);font-size:13px}

  .hoja{max-width:900px;margin:0 auto;padding:0 22px 90px}

  /* ---------- PORTADA ---------- */
  .portada{padding:30px 0 0}
  .eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--tinta-suave);margin:0 0 16px}
  .titulo{font-family:var(--display);font-weight:800;font-size:clamp(44px,12vw,108px);line-height:.86;letter-spacing:-.03em;margin:0}
  .titulo em{display:block;font-style:normal;font-size:clamp(15px,3.2vw,24px);font-weight:400;letter-spacing:.03em;color:#D6246E;margin-top:14px}
  .valle{display:block;width:100%;height:auto;margin-top:24px}
  .franja{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;justify-content:space-between;
    border-top:2px solid var(--tinta);border-bottom:1px solid var(--linea);padding:14px 0}
  .fechas{font-family:var(--display);font-weight:600;font-size:16.5px;letter-spacing:-.01em;margin:0}
  .viajeros{display:flex;flex-wrap:wrap;gap:7px}
  .viajero{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid;border-radius:999px;padding:3px 12px 4px}

  /* ---------- DÍAS ---------- */
  .dia{display:grid;grid-template-columns:64px 1fr;scroll-margin-top:84px}
  .marca{position:relative;display:flex;justify-content:center}
  .marca::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;
    background:repeating-linear-gradient(to bottom,var(--linea) 0 7px,transparent 7px 13px)}
  .dia:first-child .marca::before{top:34px}
  .dia:last-child .marca::before{bottom:auto;height:34px}
  .silleta{position:relative;width:44px;height:44px;margin-top:14px;color:var(--acento);flex:none}
  .dia.hoy .silleta{animation:latir 2.6s ease-in-out infinite}
  @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){.dia.hoy .silleta{animation:none}}

  .cuerpo{padding:26px 0 34px 20px;min-width:0}
  .dia.hoy .cuerpo{background:linear-gradient(90deg,color-mix(in srgb,var(--acento) 10%,transparent),transparent 62%);
    border-radius:14px;padding-left:16px;margin-left:4px}
  .dia-cab{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:14px}
  .fecha{font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#fff;
    background:var(--acento);padding:4px 10px 5px;border-radius:4px;white-space:nowrap}
  .insignia{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    border:1.5px solid var(--acento);color:var(--acento);border-radius:4px;padding:3px 8px 4px}
  .dia-cab h2{font-family:var(--display);font-weight:600;font-size:clamp(19px,4.2vw,26px);letter-spacing:-.02em;line-height:1.15;margin:0}
  .avance{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}

  .plan{list-style:none;margin:0;padding:0}
  .fila{display:grid;grid-template-columns:auto 96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--linea);align-items:start}
  .plan .fila:first-child{border-top:0;padding-top:2px}
  .tic{width:22px;height:22px;border-radius:50%;border:2px solid var(--linea);background:transparent;padding:0;
    margin-top:2px;display:grid;place-items:center;font-size:12px;color:transparent;flex:none}
  .tic:hover{border-color:var(--acento,#1B2A24)}
  .fila.lista .tic{background:var(--acento);border-color:var(--acento);color:#fff}
  .fila.lista .que{opacity:.5}
  .fila.lista .principal{text-decoration:line-through}
  .hora{font-family:var(--mono);font-size:13.5px;line-height:1.6;color:var(--acento);padding-top:2px;word-break:break-word}
  .hora.suave{color:var(--tinta-suave);text-transform:uppercase;font-size:11.5px;letter-spacing:.13em}
  .que{font-size:17px;min-width:0}
  .que .principal b{font-weight:800}
  .nota{display:block;font-size:14px;color:var(--tinta-suave);margin-top:2px}
  .marbete{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--linea);
    border-radius:3px;padding:1px 6px 2px;margin-left:7px;color:var(--tinta-suave);white-space:nowrap}
  .monto{font-family:var(--mono);font-size:12.5px;color:var(--acento);border:1px solid currentColor;border-radius:3px;
    padding:1px 6px 2px;margin-left:7px;white-space:nowrap}
  .mapa{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--acento);text-decoration:none;border-bottom:1px solid currentColor;margin-left:8px;white-space:nowrap}
  .mapa:hover{opacity:.7}
  .subtotal{display:flex;justify-content:flex-end;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave);padding-top:11px;border-top:1px solid var(--linea);margin-top:2px}
  .subtotal b{font-size:14px;letter-spacing:0;color:var(--tinta);font-weight:600}

  /* ---------- EDICIÓN ---------- */
  .campo{font-family:inherit;font-size:inherit;color:inherit;width:100%;background:var(--papel-2);
    border:1.5px solid var(--linea);border-radius:7px;padding:6px 9px;line-height:1.4}
  .campo:focus{outline:none;border-color:var(--acento,#1B2A24);background:#fff}
  .campo.tit{font-family:var(--display);font-weight:600;font-size:clamp(18px,4vw,24px);letter-spacing:-.02em}
  .campo.hora-campo,.campo.monto-campo,.campo.fecha-campo,.campo.lugar-campo{font-family:var(--mono);font-size:13px}
  .campo.nota-campo{font-size:14px;color:var(--tinta-suave)}
  .campo.fecha-campo{width:auto;min-width:150px}
  .fila.edit{grid-template-columns:1fr;gap:8px;background:var(--papel-2);border:1.5px solid var(--linea);
    border-radius:12px;padding:12px;margin:8px 0}
  .duo{display:grid;grid-template-columns:150px 1fr;gap:8px}
  .trio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .acciones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .mini{border:1.5px solid var(--linea);background:var(--papel-2);color:var(--tinta-suave);width:32px;height:32px;
    border-radius:8px;font-size:15px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
  .mini:hover{border-color:var(--tinta);color:var(--tinta)}
  .mini.borrar:hover{border-color:#D6246E;color:#D6246E}
  .mini:disabled{opacity:.35;cursor:not-allowed}
  .interruptor{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave)}
  .agregar{border:1.5px dashed var(--linea);background:transparent;color:var(--tinta-suave);width:100%;padding:10px;
    border-radius:10px;font-size:14px;font-weight:600;margin-top:10px}
  .agregar:hover{border-color:var(--acento,#1B2A24);color:var(--acento,#1B2A24);border-style:solid}
  .agregar.dia-nuevo{margin:6px 0 0;border-width:2px}
  .foto{margin:0 0 16px;position:relative}
  .foto img{display:block;width:100%;height:auto;aspect-ratio:21/9;object-fit:cover;border-radius:12px;
    background:var(--papel-2);box-shadow:0 1px 0 var(--linea)}
  .foto::after{content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acento) 45%,transparent)}
  .foto figcaption{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--tinta-suave);margin-top:6px;line-height:1.5}
  .foto figcaption a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .foto figcaption a:hover{color:var(--acento)}
  .fotos-elegir{margin-top:10px}
  .etq-mini{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--tinta-suave);margin-bottom:6px}
  .tiras{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
  .tira{width:62px;height:40px;padding:0;border:2px solid var(--linea);border-radius:8px;
    overflow:hidden;background:var(--papel-2);flex:none}
  .tira img{width:100%;height:100%;object-fit:cover;display:block}
  .tira[aria-pressed="true"]{border-color:var(--acento)}
  .tira.ninguna{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--tinta-suave);display:grid;place-items:center;line-height:1.2}
  .lapiz{border:1.5px solid var(--linea);background:var(--papel-2);color:var(--tinta-suave);
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:4px 9px 5px;border-radius:999px;white-space:nowrap;margin-left:auto;flex:none}
  .lapiz:hover{border-color:var(--acento);color:var(--acento)}
  .lapiz.activo{border-color:var(--acento);background:var(--acento);color:#fff}
  .dia.abierto{background:var(--papel-2);border-radius:14px}
  .dia.abierto .cuerpo{padding-right:14px}
  .colores{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .color{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0}
  .color[aria-pressed="true"]{border-color:var(--tinta);transform:scale(1.12)}
  .cab-edit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

  /* ---------- BLOQUES FINALES ---------- */
  .bloque{margin-top:26px;background:var(--papel-2);border:2px solid var(--tinta);border-radius:14px;padding:24px 26px 20px}
  .bloque h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
  .bloque .sub{font-size:14px;color:var(--tinta-suave);margin:0 0 16px}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 26px}
  .dato dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:3px}
  .dato dd{margin:0;font-size:16.5px;font-weight:600}
  .dato dd small{display:block;font-weight:400;font-size:14px;color:var(--tinta-suave);letter-spacing:0}
  .pendientes{list-style:none;margin:0;padding:0}
  .pendientes li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--linea)}
  .pendientes li:first-child{border-top:0}
  .pendientes li.lista .tic{background:#0F6B4F;border-color:#0F6B4F;color:#fff}
  .pendientes li.lista .txt{opacity:.5;text-decoration:line-through}
  .pendientes .txt{flex:1;min-width:0}
  .total{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:space-between;
    margin-top:20px;padding-top:16px;border-top:2px solid var(--tinta)}
  .total .etq{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-suave)}
  .total .cifra{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.02em;text-align:right}
  .total .cifra small{display:block;font-family:var(--texto);font-weight:400;font-size:13.5px;color:var(--tinta-suave);letter-spacing:0;margin-top:3px}
  .tasa{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-family:var(--mono);
    font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave)}
  .tasa input{width:100px;font-family:var(--mono);font-size:13px;padding:4px 8px;border:1.5px solid var(--linea);
    border-radius:6px;background:var(--papel-2);color:var(--tinta)}

  details.guia{border-top:1px solid var(--linea);padding:12px 0 0;margin-top:12px}
  details.guia summary{font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  details.guia summary::-webkit-details-marker{display:none}
  details.guia summary::after{content:"+";font-family:var(--mono);color:var(--tinta-suave);font-size:17px}
  details.guia[open] summary::after{content:"–"}
  details.guia ul{margin:12px 0 14px;padding-left:20px;font-size:15.5px}
  details.guia li{margin-bottom:7px}
  details.guia li b{font-weight:800}

  .pie{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave)}
  .flores{display:flex;gap:5px}
  .flores i{width:9px;height:9px;border-radius:50%;display:block}

  @media (max-width:600px){
    body{font-size:16px}
    .dia{grid-template-columns:44px 1fr}
    .silleta{width:32px;height:32px;margin-top:18px}
    .cuerpo{padding-left:14px}
    .fila{grid-template-columns:auto 1fr;gap:5px 10px}
    .fila .hora{grid-column:2;padding-top:0}
    .fila .que{grid-column:2}
    .fila.edit{grid-template-columns:1fr;gap:8px}
    .foto img{aspect-ratio:16/9}
    .duo{grid-template-columns:1fr}
    .bloque{padding:20px 18px 16px}
  }

  @media print{
    .barra,.aviso,.cinta,.no-imprimir,details.guia{display:none !important}
    body{background:#fff;font-size:15px}
    .hoja{max-width:none;padding:0}
    .dia,.bloque{break-inside:avoid}
    .foto{display:none}
    .dia.hoy .cuerpo{background:none}
    .fila{grid-template-columns:96px 1fr}
  }
</style>
</head>
<body>

<div class="barra no-imprimir">
  <div class="barra-int">
    <span class="estado"><span class="punto" id="punto"></span><span id="txtEstado">Conectando…</span></span>
    <button class="boton fantasma" id="btnHoy" hidden>Hoy</button>
    <button class="boton" id="btnEditar">Editar</button>
    <details class="menu">
      <summary class="boton fantasma" aria-label="Más opciones">•••</summary>
      <div class="menu-caja">
        <button id="btnImprimir">Imprimir o guardar PDF</button>
        <button id="btnCompartir">Compartir el link</button>
        <button id="btnDescargar">Descargar una copia</button>
      </div>
    </details>
  </div>
</div>

<div id="cinta"></div>
<div id="avisoLocal"></div>
<div class="hoja"><div id="app"></div></div>

<script type="module">
/* ============================================================
   1. SDK (se carga en caliente: sin red, la app abre igual)
   ============================================================ */
let FB = null;
try {
  const [a, f] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
  ]);
  FB = { ...a, ...f };
} catch(e){ console.warn("SDK de Firebase no disponible:", e); }

/* ============================================================
   2. PALETA Y DATOS INICIALES
   ============================================================ */
const PALETA = {
  fucsia:"#D6246E", naranja:"#E4571E", selva:"#0F6B4F", cielo:"#2B7FBF",
  cafe:"#8C4A2F", morado:"#6C3FA8", turquesa:"#148F8A", vino:"#9B1B47"
};
// Fotos de cada día. Todas de Wikimedia Commons con licencia libre;
// el crédito sale bajo la imagen porque CC BY y CC BY-SA lo exigen.
const FOTOS = {
  medellin:{
    archivo:"medellin.jpg", alt:"Panorámica de Medellín desde el Cerro El Picacho",
    pie:"Medellín desde el Cerro El Picacho", autor:"Luis90f", lic:"CC BY-SA 4.0",
    licUrl:"https://creativecommons.org/licenses/by-sa/4.0/",
    fuente:"https://commons.wikimedia.org/wiki/File:Panor%C3%A1mica_de_Medell%C3%ADn_desde_el_Cerro_El_Picacho.jpg"},
  comuna13:{
    archivo:"comuna13.jpg", alt:"Escaleras eléctricas de la Comuna 13",
    pie:"Escaleras eléctricas de la Comuna 13", autor:"Juan Gómez", lic:"CC BY 2.0",
    licUrl:"https://creativecommons.org/licenses/by/2.0/",
    fuente:"https://commons.wikimedia.org/wiki/File:Escaleras_el%C3%A9ctricas_de_la_comuna_13,_Medell%C3%ADn_-_04.jpg"},
  penol:{
    archivo:"penol.jpg", alt:"La Piedra del Peñol y el embalse vistos desde un dron",
    pie:"La Piedra del Peñol y el embalse", autor:"Juan Gómez", lic:"CC BY 2.0",
    licUrl:"https://creativecommons.org/licenses/by/2.0/",
    fuente:"https://commons.wikimedia.org/wiki/File:Piedra_y_Embalse_del_Pe%C3%B1ol_desde_dron_05.jpg"},
  parapente:{
    archivo:"parapente.jpg", alt:"Parapente sobre los cerros del valle de Aburrá",

function normalizar(e){
  e.meta = { titulo:"MEDELLÍN", subtitulo:"", eyebrow:"", moneda:"COP", tasaCRC:0.14, viajeros:[], ...(e.meta||{}) };
  e.dias = (e.dias||[]).map((d,i) => ({
    id:d.id||nid(), fecha:d.fecha||"", titulo:d.titulo||"", color:d.color||"fucsia",
    foto: typeof d.foto === "string" ? d.foto : (FOTOS_POR_DEFECTO[i] || ""),
    actividades:(d.actividades||[]).map(a => ({
      id:a.id||nid(), hora:a.hora||"", texto:a.texto||"", nota:a.nota||"",
      lugar:a.lugar||"", monto:Number(a.monto)||0, opcional:!!a.opcional, hecha:!!a.hecha
    }))
  }));
  e.esencial = e.esencial||[];
  e.pendientes = (e.pendientes||[]).map(p => ({id:p.id||nid(), texto:p.texto||"", hecho:!!p.hecho}));
  return e;
}

// Qué días están abiertos para editar. Vacío = todos se ven en modo lectura.

function guardar(){
  if (modoLocal) return;
  clearTimeout(timerGuardar);
  ponEstado("Guardando…","guardando");
  timerGuardar = setTimeout(async () => {
    try {
      ultimoEnviado = JSON.stringify(estado);
      await FB.setDoc(refDoc, estado);
      ponEstado("Guardado");
    } catch(e){ console.error(e); ponEstado("No se pudo guardar"); }
  }, 700);
}

if (!modoLocal) {
  try {
    const inicial = await FB.getDoc(refDoc);
    if (!inicial.exists()) await FB.setDoc(refDoc, estado);
  } catch(e){ console.error(e); }

  FB.onSnapshot(refDoc, (snap) => {
    if (!snap.exists()) return;
    const remoto = normalizar(snap.data());
    const json = JSON.stringify(remoto);
    if (json === ultimoEnviado || json === JSON.stringify(estado)) { ponEstado("Guardado"); return; }
    if (escribiendo) { remotoPendiente = remoto; return; }
    estado = remoto; render(); ponEstado("Actualizado");
  }, (e) => { console.error(e); ponEstado("Sin conexión","local"); });
}

const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function partes(iso){
  const [a,m,d]=String(iso||"").split("-").map(Number);
  if(!a||!m||!d) return null;
  return {f:new Date(Date.UTC(a,m-1,d)),a,m,d};
}
const etiquetaCorta = iso => { const p=partes(iso); return p ? `${DIAS_SEM[p.f.getUTCDay()]} ${p.d}` : "Día"; };
const etiquetaLarga = iso => { const p=partes(iso); return p ? `${LARGO[DIAS_SEM[p.f.getUTCDay()]]} ${p.d} de ${MESES[p.m-1]}` : ""; };
function hoyISO(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; }
function diasEntre(a,b){ const pa=partes(a), pb=partes(b); return (pa&&pb) ? Math.round((pb.f-pa.f)/86400000) : null; }

const horaSuave = h => !/\d/.test(String(h||""));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => new Intl.NumberFormat("es-CO",{maximumFractionDigits:0}).format(Number(n)||0);
const moneda = n => `${num(n)} ${estado.meta.moneda||"COP"}`;
const enColones = n => `≈ ₡${num((Number(n)||0)*(Number(estado.meta.tasaCRC)||0))}`;

function tarjetaDia(d,i,total){
  const acento = PALETA[d.color]||PALETA.fucsia;
  const sub = totalDia(d);
  const esHoy = d.fecha === hoyISO();
  const hechas = (d.actividades||[]).filter(a=>a.hecha).length;
  const abierto = editando && diasAbiertos.has(d.id);
  return `
  <section class="dia ${esHoy?"hoy":""} ${abierto?"abierto":""}" style="--acento:${acento}" data-dia="${d.id}" id="dia-${d.id}">
    <div class="marca">${silleta()}</div>
    <div class="cuerpo">
      ${foto(d)}
      ${abierto ? cabeceraEdit(d,i,total) : `
        <div class="dia-cab">
          <span class="fecha">${esc(etiquetaCorta(d.fecha))}</span>
          ${esHoy?`<span class="insignia">Hoy</span>`:""}
          <h2>${esc(d.titulo)}</h2>
          ${hechas?`<span class="avance">${hechas} de ${d.actividades.length} listas</span>`:""}
          ${editando?`<button class="lapiz no-imprimir" data-accion="editar-dia"
            aria-expanded="false" aria-label="Editar este día">✎ Editar</button>`:""}
        </div>`}
      <ul class="plan">${(d.actividades||[]).map((a,j)=>
        abierto ? filaEdit(a,j,d.actividades.length) : filaVista(a)).join("")}</ul>
      ${sub>0?`<p class="subtotal"><span>Subtotal del día</span><b>${moneda(sub)}</b></p>`:""}
      ${abierto?`<button class="agregar no-imprimir" data-accion="agregar-act">+ Agregar actividad</button>`:""}
    </div>
  </section>`;
}

function pintarCinta(){
  const dias = estado.dias||[];
  if (!dias.length){ $cinta.innerHTML=""; $btnHoy.hidden=true; return; }
  const hoy = hoyISO();
  const idx = dias.findIndex(d=>d.fecha===hoy);
  const faltan = diasEntre(hoy, dias[0].fecha);
  let html = "", acento = PALETA[dias[0].color]||PALETA.fucsia;

  if (idx >= 0){
    acento = PALETA[dias[idx].color]||acento;
    html = `<span>Hoy · día ${idx+1} de ${dias.length}</span><span>${esc(dias[idx].titulo)}</span>`;
    $btnHoy.hidden = false;
    $btnHoy.dataset.destino = "dia-" + dias[idx].id;
  } else if (faltan !== null && faltan > 0){
    html = `<span>${faltan===1 ? "Falta 1 día" : `Faltan ${faltan} días`}</span><span>para Medellín</span>`;
    $btnHoy.hidden = true;
  } else {
    $btnHoy.hidden = true;
  }
  $cinta.innerHTML = html ? `<div class="cinta no-imprimir"><span class="cinta-int" style="--acento:${acento}">${html}</span></div>` : "";
}

/* ============================================================
   7. INTERACCIÓN
   ============================================================ */
const buscarDia = id => estado.dias.find(d=>d.id===id);
const mover = (arr,i,paso) => { const j=i+paso; if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; };

app.addEventListener("click",(ev)=>{
  const btn = ev.target.closest("[data-accion]");
  if (!btn) return;
  const accion = btn.dataset.accion;
  const dia = buscarDia(btn.closest("[data-dia]")?.dataset.dia);
  const idAct = btn.closest("[data-act]")?.dataset.act;
  const idPend = btn.closest("[data-pend]")?.dataset.pend;

  // Abrir o cerrar un día concreto. No cambia datos, así que no guarda.
  if (accion==="editar-dia" && dia){
    if (diasAbiertos.has(dia.id)) diasAbiertos.delete(dia.id); else diasAbiertos.add(dia.id);
    render();
    if (diasAbiertos.has(dia.id))
      document.getElementById("dia-"+dia.id)?.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }

  if (accion==="tic" && dia){ const a = dia.actividades.find(x=>x.id===idAct); if(a) a.hecha = !a.hecha; }
  if (accion==="agregar-act" && dia) dia.actividades.push(act("",""));
  if (accion==="borrar-act" && dia){
    if(!confirm("¿Borrar esta actividad?")) return;
    dia.actividades = dia.actividades.filter(a=>a.id!==idAct);
  }
  if ((accion==="subir-act"||accion==="bajar-act") && dia)
    mover(dia.actividades, dia.actividades.findIndex(a=>a.id===idAct), accion==="subir-act"?-1:1);
  if ((accion==="subir-dia"||accion==="bajar-dia") && dia)
    mover(estado.dias, estado.dias.findIndex(d=>d.id===dia.id), accion==="subir-dia"?-1:1);
  if (accion==="color" && dia) dia.color = btn.dataset.color;
  if (accion==="foto" && dia) dia.foto = btn.dataset.foto;
  if (accion==="borrar-dia" && dia){
    if(!confirm(`¿Borrar el día "${dia.titulo||etiquetaCorta(dia.fecha)}" con todas sus actividades?`)) return;
    diasAbiertos.delete(dia.id);
    estado.dias = estado.dias.filter(d=>d.id!==dia.id);
  }
  if (accion==="agregar-dia"){
    const ult = estado.dias[estado.dias.length-1];
    let fecha = hoyISO();
    if (ult){ const p=partes(ult.fecha); if(p){ p.f.setUTCDate(p.f.getUTCDate()+1); fecha = p.f.toISOString().slice(0,10); } }
    const usados = estado.dias.map(d=>d.color);
    const color = Object.keys(PALETA).find(c=>!usados.includes(c)) || "fucsia";
    estado.dias.push({id:nid(), fecha, titulo:"Día nuevo", color, actividades:[act("","")]});
  }
  if (accion==="tic-pendiente"){ const p = estado.pendientes.find(x=>x.id===idPend); if(p) p.hecho = !p.hecho; }
  if (accion==="agregar-pendiente") estado.pendientes.push({id:nid(), texto:"", hecho:false});
  if (accion==="borrar-pendiente"){
    if(!confirm("¿Borrar este pendiente?")) return;
    estado.pendientes = estado.pendientes.filter(p=>p.id!==idPend);
  }

  render(); guardar();
});

app.addEventListener("input",(ev)=>{
  const campo = ev.target.dataset.campo;
  if (!campo) return;

  if (campo==="tasa"){ estado.meta.tasaCRC = Number(ev.target.value)||0; guardar(); return; }
  if (campo==="pendiente"){
    const id = ev.target.closest("[data-pend]")?.dataset.pend;
    const p = estado.pendientes.find(x=>x.id===id); if(p) p.texto = ev.target.value;
    guardar(); return;
  }

  const dia = buscarDia(ev.target.closest("[data-dia]")?.dataset.dia);
  if (!dia) return;
  const idAct = ev.target.closest("[data-act]")?.dataset.act;

  if (idAct){
    const a = dia.actividades.find(x=>x.id===idAct); if(!a) return;
    if (campo==="opcional") a.opcional = ev.target.checked;
    else if (campo==="monto") a.monto = Number(ev.target.value)||0;
    else a[campo] = ev.target.value;
  } else {
    dia[campo] = ev.target.value;
    if (campo==="fecha"){
      const chip = ev.target.closest(".cuerpo")?.querySelector(".fecha");
      if (chip) chip.textContent = etiquetaCorta(ev.target.value);
      pintarCinta();
    }
  }
  guardar();
});

app.addEventListener("focusin", ()=>{ escribiendo = true; });
app.addEventListener("focusout", ()=>{
  escribiendo = false;
  if (remotoPendiente){ estado = remotoPendiente; remotoPendiente = null; render(); }
});

document.getElementById("btnImprimir").addEventListener("click",()=>{ cerrarMenu(); window.print(); });

  cerrarMenu();
  const datos = {title:"Itinerario Medellín", text:"Nuestro plan del 10 al 15 de septiembre", url:location.href};
  try {
    if (navigator.share) await navigator.share(datos);

});

  cerrarMenu();
  const blob = new Blob([JSON.stringify(estado,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `itinerario-medellin-${hoyISO()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
document.addEventListener("click",(e)=>{ if(!e.target.closest(".menu")) cerrarMenu(); });

render();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
